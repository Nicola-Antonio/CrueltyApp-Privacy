<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawVerify</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f7f5f0;
      color: #2c4a34;
      line-height: 1.7;
      padding: 40px 20px 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border-radius: 18px;
      padding: 48px 52px;
      box-shadow: 0 4px 32px rgba(44, 74, 52, 0.08);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(107, 153, 112, 0.13);
      color: #6b9970;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 36px;
      font-weight: 700;
      color: #2c4a34;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: #2c4a34;
      opacity: 0.5;
      margin-bottom: 32px;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(44, 74, 52, 0.1);
      margin: 32px 0;
    }

    p { margin-bottom: 12px; font-size: 15px; }

    a { color: #6b9970; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .links {
      margin-top: 24px;
    }

    .links a {
      display: inline-block;
      background: rgba(107, 153, 112, 0.1);
      color: #2c4a34;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 22px;
      border-radius: 10px;
      margin: 6px 8px;
      transition: background 0.2s;
    }

    .links a:hover {
      background: rgba(107, 153, 112, 0.22);
      text-decoration: none;
    }

    footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid rgba(44, 74, 52, 0.1);
      font-size: 13px;
      color: #2c4a34;
      opacity: 0.45;
    }

    @media (max-width: 600px) {
      .container { padding: 28px 22px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="badge">Cruelty-Free</div>
  <h1>PawVerify</h1>
  <p class="subtitle">Scan. Verify. Shop responsibly.</p>

  <hr class="divider" />

  <p>
    Contact: <a href="mailto:crueltyfree.app@proton.me">crueltyfree.app@proton.me</a>
  </p>

  <div class="links">
    <a href="privacy-policy-en.html">Privacy Policy</a>
    <a href="privacy-policy.html">Politique de confidentialit&eacute;</a>
  </div>

  <footer>
    &copy; 2026 PawVerify &nbsp;&middot;&nbsp;
    <a href="mailto:crueltyfree.app@proton.me">crueltyfree.app@proton.me</a>
  </footer>

</div>
</body>
</html>
